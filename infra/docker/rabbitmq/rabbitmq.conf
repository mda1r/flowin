## RabbitMQ Configuration for NexusPOS

# Enable management plugin definitions
management.load_definitions = /etc/rabbitmq/definitions.json

# Logging
log.console = true
log.console.level = info
log.file = false

# Heartbeat
heartbeat = 60

# Memory threshold
vm_memory_high_watermark.relative = 0.4
vm_memory_high_watermark_paging_ratio = 0.5

# Disk free space
disk_free_limit.absolute = 2GB

# Default user (overridden by definitions.json for production)
default_vhost = nexuspos

# Consumer timeout — 30 minutes max
consumer_timeout = 1800000
